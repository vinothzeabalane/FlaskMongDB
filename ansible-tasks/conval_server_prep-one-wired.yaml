---
- name: Execute recovery process
  hosts: uart-server
  become: yes  # Ensure to run with sudo privileges for all tasks
  environment:
    PYTHONPATH: "/home/remlab/bhb_tools/lib"

  vars_prompt:
    - name: "binary"
      prompt: "Enter the binary name (e.g., HDC_M23_WW07.3_C0_B.23.24.tgz)"
      default: "HDC_M23_WW07.3_C0_B.23.24.tgz"

  vars:
    extracted_dir: "/tmp/{{ binary | regex_replace('.tgz', '') }}/trenton-kv7/fw_release_package/platform_services_fw/sbbph28x019tgf_mc0b271"

  tasks:

    - name: Check current user
      command: whoami
      register: result

    - name: Display the current user
      debug:
        msg: "Current user is {{ result.stdout }}"

    - name: Recovery process started with start time
      command: echo "************** Recovery process started at $(date) **********************************************"

    - name: 1. Copy the .tgz file to /tmp
      copy:
        src: "/mnt/ydrive/fast-data/Releases/CV/HuntsdaleC/Internal/{{ binary }}"
        dest: "/tmp"
        remote_src: yes  # This tells Ansible that the file is already on the remote server
      when: binary is defined

    - name: 2. Extract the .tgz file
      unarchive:
        src: "/tmp/{{ binary }}"
        dest: "/tmp/"
        remote_src: yes
        creates: "{{ extracted_dir }}"  # Only extract if directory doesn't exist
      when: binary is defined

    - name: 3. Verify extracted directory exists
      stat:
        path: "{{ extracted_dir }}"
      register: extracted_directory
      when: binary is defined

    - name: Fail if extracted directory doesn't exist
      fail:
        msg: "The expected directory does not exist. Please check the extraction."
      when: extracted_directory.stat.exists == false

    - name: 4. Find the firmware file inside the extracted directory
      find:
        paths: "{{ extracted_dir }}/{{ eeprom }}"
      register: one_wired_binary
      when: binary is defined

    - name: 5. Display the full path of the found firmware file
      debug:
        msg: "Full path of firmware file: {{ one_wired_binary }}"
      when: one_wired_binary

    - name: 6. Define the corrupt_eeprom function
      block:
        - name: Corrupt the EEPROM at slot-0 (TBL trap mode)
          shell: |
            echo "Corrupting the EEPROM at search pattern 000e0010"
            sudo hexdump -C {{ eeprom }} | grep "000e0010"
            sudo printf '\xfb\xfb\xfb\xfb\xfb\xfb\xfb\xfb' | dd of={{ eeprom }} bs=1 seek=917520 count=8 conv=notrunc
            sudo hexdump -C {{ eeprom }} | grep "000e0010"
          args:
            chdir: "{{ extracted_dir }}"
        - name: Corrupt the EEPROM at slot-1 (TBL trap mode)
          shell: |
            echo "Corrupting the EEPROM at search pattern 00320010"
            sudo hexdump -C {{ eeprom }} | grep "00320010"
            sudo printf '\xfb\xfb\xfb\xfb\xfb\xfb\xfb\xfb' | dd of={{ eeprom }} bs=1 seek=3276816 count=8 conv=notrunc
            sudo hexdump -C {{ eeprom }} | grep "00320010"
          args:
            chdir: "{{ extracted_dir }}"
      when: binary is defined  # Only run if binary is defined

    - name: 7. Run the firmware update process
      command: >
        ./dpcmd -z "{{ extracted_dir }}/{{ eeprom }}"
      args:
        chdir: /home/remlab/Desktop/Dediprog-latest/SF100Linux
      when: one_wired_binary

    - name: 8. Power cycle drive
      command: sudo ./pita_cycle -a
      args:
        chdir: /home/remlab/bhb_tools/

    - name: 9. Sleep for 20 seconds
      pause:
        seconds: 20

    - name: 10. Reboot the system
      reboot:
        reboot_timeout: 600  # Maximum wait time for the node to reboot (in seconds)
        test_command: uptime  # Command to test if the system is back up

    - name: Recovery process ended time
      command: echo "************** Recovery process ended at $(date) **********************************************"
