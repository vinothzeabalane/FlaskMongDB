version: '3.3'

services:
  web:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - seyon_odoo:/usr/lib/python3/dist-packages/odoo  # Mount the Odoo source

    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo  # Directly setting the password here
    networks:
      - odoo-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo  # Directly setting the password here
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  odoo-web-data:
  odoo-db-data:
  seyon_odoo:

networks:
  odoo-network:
    driver: bridge
