version: '3.3'

services:
  nagios4:
    container_name: seyon_nagios4
    hostname: seyon_nagios4
    image: jasonrivers/nagios:latest
    command: /usr/local/bin/start_nagios
    restart: always
    ports:
      - "8080:80"       # Host port 8080 mapped to container port 80
      - "5667:5667"     # Exposed, but you can adjust mapping if needed
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - NAGIOS_HOME=/opt/nagios
      - NAGIOS_USER=nagios
      - NAGIOS_GROUP=nagios
      - NAGIOS_CMDUSER=nagios
      - NAGIOS_CMDGROUP=nagios
      - NAGIOS_FQDN=nagios.example.com
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASS=nagios
      - APACHE_RUN_USER=nagios
      - APACHE_RUN_GROUP=nagios
      - NAGIOS_TIMEZONE=UTC
      - DEBIAN_FRONTEND=noninteractive
      - NG_NAGIOS_CONFIG_FILE=/opt/nagios/etc/nagios.cfg
      - NG_CGI_DIR=/opt/nagios/sbin
      - NG_WWW_DIR=/opt/nagios/share/nagiosgraph
      - NG_CGI_URL=/cgi-bin
      - NAGIOS_BRANCH=nagios-4.5.7
      - NAGIOS_PLUGINS_BRANCH=release-2.4.12
      - NRPE_BRANCH=nrpe-4.1.1
      - NCPA_BRANCH=v3.1.1
      - NSCA_BRANCH=nsca-2.10.2
      - NAGIOSTV_VERSION=0.9.2
      - APACHE_LOCK_DIR=/var/run
      - APACHE_LOG_DIR=/var/log/apache2
    volumes:
      - nagios_var:/opt/nagios/var
      - nagiosgraph_etc:/opt/nagiosgraph/etc
      - nagiosgraph_var:/opt/nagiosgraph/var
      - apache_logs:/var/log/apache2
      - custom_plugins:/opt/Custom-Nagios-Plugins
      - nagios_etc:/opt/nagios/etc
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M # You can adjust based on needs

volumes:
  nagios_var:
  nagiosgraph_etc:
  nagiosgraph_var:
  apache_logs:
  custom_plugins:
  nagios_etc:

networks:
  default:
    driver: bridge
