version: '3.3'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_API_BASE_URL=http://10.74.134.8:11434
    volumes:
      - openwebui_data:/app/backend/data
    restart: always

volumes:
  openwebui_data:
