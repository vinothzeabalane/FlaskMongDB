<head>
    <meta charset="utf-8">
    <title>My Account</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width">
    <link href="http://fonts.googleapis.com/css?family=Open+Sans:300,200,400,500,600" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/templatemo-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <script src="{{ url_for('static', filename='js/vendor/modernizr-2.6.2.min.js') }}"></script>
</head>

<body>
    <header class="site-header">
        <div class="main-header" style="padding-top: 0px;padding-bottom: 0px; height: 120px;">
            <div class="container">
                <div class="row">
                    <div class="col-md-4 col-sm-6 col-xs-8">
                        <div class="logo">
                            <h1 style="height: 110px;>
                                    <a href="#"> <img
                                       src="{{ url_for('static', filename='img/PS.jpg') }}"
                                       height="100" width="100" alt="Platform Service" />
                                    </a>
                                 </h1>
                        </div>
                        <!-- /.logo -->
                    </div>
                    <!-- /.col-md-4 -->
                    <div class="pull-right" style="height: 50px; padding-top: 60px;>
                        <ul class="menu">
                            {% if user %}
                            	<img src="{{ url_for('static', filename='img/user.jpg') }}" alt="User" width="30" height="30">
                            	<a>{{user}}<a>&nbsp;&nbsp;&nbsp;&nbsp; <a href="{{ url_for('logout') }}"> <span class="glyphicon glyphicon-log-out"></span> Log out </a></a>
                            {% endif %}
                        </ul>
                    </div>
                </div>
                <!-- /.row -->
            </div>
            <!-- /.container -->
        </div>
        <!-- /.main-header -->
        <div class="main-nav">
            <div class="container">
                <div class="row">
                    <div>
                        <div class="list-menu">
                            <ul>
                                <li><a href="{{ url_for('dashboard') }}">My Dashboard</a></li>
                                {% if is_admin %}
                                <li><a href="{{ url_for('groups') }}">Groups</a></li>
                                <li><a href="{{ url_for('users') }}">Users</a></li>
                                {% endif %}
                                <li><a href="{{ url_for('bpt') }}">Boot Profile Time</a></li>
                                <li><a href="{{ url_for('account') }}">My Account</a></li>
                            </ul>
                        </div>
                        <!-- /.list-menu -->
                    </div>
                    <!-- /.col-md-6 -->
                </div>
                <!-- /.row -->
            </div>
        </div>
        <!-- /.container -->
        <!-- /.main-nav -->
    </header>
    <!-- /.site-header -->
    <div class="row">
        <div class="container">
                     
                            {% if error %}
                            <p class="error"><strong>{{ error }}</strong></p>
                            {% endif %}

            <form action="{{ url_for('account_update') }}" method="post">
                <div class="row">
                    <div class="col-md-12" style="padding-left: 11px;">
                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <span class="heading">Update Password</span>
                            </div>
                            <div class="panel-body grey-color">
                                <div class="row">
                                    <label><b style="color: #000000;">Current Password</b></label>
                                    <input type="text" name="oldpass" style="width: 40%;margin-left: 6%;" required>
                                </div>
                                <br/>
                                <br/>
                                <div class="row">
                                    <label><b style="color: black;">New Password</b></label>
                                    <input type="text" name="newpass" style="width: 40%;margin-left: 8%;" required>   <br><br>                             
                                </div>
                                    <button type="submit" class="btn btn-primary login-button" style="margin-left: 40%;">Submit</button>                               
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div>
    </div>
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.easing-1.3.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
</body>

</html>
